<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inicio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>
  /* Portada. Pocas cosas y muy grandes: cuantas mas opciones hay en la
     pantalla, mas se bloquean. Lo que se usa a diario arriba, lo raro
     abajo, y la ayuda siempre visible en un color que no se usa para
     nada mas. */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    background:#eef1f4; color:#141414; padding:20px 16px 130px;
  }
  h1{font-size:26px; line-height:1.25; margin:6px 0 4px;}
  .sub{font-size:16.5px; color:#5f5f5f; margin-bottom:22px; line-height:1.4;}

  .op{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    margin-bottom:13px; padding:19px 18px; border:none; border-radius:18px;
    background:#0b7a3b; color:#fff; box-shadow:0 5px 0 #065c2c;
  }
  .op.azul{background:#0a5fa8; box-shadow:0 5px 0 #083f70;}
  .op.gris{background:#fff; color:#141414; box-shadow:0 4px 0 #c9cfd6; border:2px solid #d6dbe1;}
  .op:active{transform:translateY(4px); box-shadow:0 1px 0 #065c2c;}
  .op .ic{font-size:32px; flex-shrink:0;}
  .op .tx{flex:1; min-width:0;}
  .op .tx b{font-size:21px; display:block; line-height:1.25;}
  .op .tx span{font-size:15px; opacity:.93; display:block; margin-top:3px; line-height:1.3;}
  .op .quitar{
    flex-shrink:0; width:38px; height:38px; border-radius:50%; border:2px solid #bbb;
    background:#fff; color:#888; font-size:17px;
  }

  h2{font-size:14px; color:#5f5f5f; text-transform:uppercase; letter-spacing:.07em;
     margin:28px 4px 12px;}

  .fila{display:flex; gap:9px; margin-bottom:12px;}
  .fila input{
    flex:1; padding:15px; font-size:17px; border:2px solid #c3c9d0;
    border-radius:12px; background:#fff; min-width:0;
  }
  .fila button{
    flex-shrink:0; padding:15px 20px; font-size:17px; font-weight:700;
    border:none; border-radius:12px; background:#5f5f5f; color:#fff;
  }

  /* El boton de ayuda: morado, un color que no se usa para nada mas en
     toda la app, y siempre pegado abajo. Si hace falta, tiene que estar
     ahi sin buscarlo. */
  #ayuda{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(238,241,244,0), #eef1f4 30%);
  }
  #ayuda button{
    width:100%; padding:22px; border:none; border-radius:18px;
    background:#7a1fa2; color:#fff; box-shadow:0 5px 0 #56166f;
    font-size:25px; font-weight:800; display:flex; align-items:center;
    justify-content:center; gap:12px;
  }
  #ayuda button:active{transform:translateY(4px); box-shadow:0 1px 0 #56166f;}
</style>
</head>
<body>

<h1>¿Qué quiere hacer?</h1>
<div class="sub">Yo le acompaño y le aviso si algo intenta engañarle.</div>

<!-- Lo primero de todo, y en verde: es la puerta de entrada para quien
     no sabe ni por donde empezar, que es la mayoria. -->
<button class="op" onclick="location.href='quiero.html'"
        style="background:#0b7a3b;box-shadow:0 5px 0 #065c2c;margin-bottom:20px">
  <span class="ic">🎤</span>
  <span class="tx"><b>Dígame qué necesita</b>
  <span>Hábleme o escríbamelo y yo lo busco</span></span>
</button>

<div id="lista"></div>

<h2>Otra cosa</h2>
<div class="fila">
  <input id="dir" type="text" placeholder="escriba qué busca..." autocomplete="off">
  <button onclick="irADireccion()">Buscar</button>
</div>
<button class="op gris" onclick="anadir()">
  <span class="ic">➕</span>
  <span class="tx"><b>Añadir una página mía</b><span>Para tenerla siempre a mano</span></span>
</button>

<div id="ayuda">
  <button onclick="location.href='emergencia.html'">
    <span>🆘</span><span>Necesito ayuda</span>
  </button>
</div>

<script>
/* ---------------------------------------------------------------------
   FAVORITOS
   Las personas mayores no navegan: van a cuatro sitios y siempre los
   mismos. Buscar cada vez es una barrera enorme, y ademas es donde se
   cuelan las paginas falsas que imitan a las de verdad. Con un boton
   fijo se va siempre al sitio correcto.
   Se guardan en el propio movil, no salen a ningun sitio.
   --------------------------------------------------------------------- */
var CLAVE = 'paginas_favoritas_v1';

var PORDEFECTO = [
  { ic:'🪪', nom:'Pedir cita para el DNI', des:'Le guío casilla por casilla',
    url:'https://www.citapreviadnie.es/', fija:true, color:'' },
  { ic:'🛒', nom:'Amazon', des:'Le aviso de cobros escondidos',
    url:'https://www.amazon.es/', fija:false, color:'azul' }
];

function cargar(){
  try{ var g = localStorage.getItem(CLAVE); if(g) return JSON.parse(g); }catch(e){}
  return PORDEFECTO;
}
function guardar(l){ try{ localStorage.setItem(CLAVE, JSON.stringify(l)); }catch(e){} }

var favoritas = cargar();

function pintar(){
  var h = '';
  favoritas.forEach(function(p, i){
    h += '<button class="op ' + (p.color||'') + '" onclick="abrir(' + i + ')">' +
         '<span class="ic">' + p.ic + '</span>' +
         '<span class="tx"><b>' + p.nom + '</b><span>' + (p.des||'') + '</span></span>' +
         (p.fija ? '' :
           '<span class="quitar" onclick="quitar(event,' + i + ')">✕</span>') +
         '</button>';
  });
  document.getElementById('lista').innerHTML = h;
}

function abrir(i){ location.href = favoritas[i].url; }

function quitar(ev, i){
  ev.stopPropagation();
  if(confirm('¿Quitar "' + favoritas[i].nom + '" de sus páginas?')){
    favoritas.splice(i,1); guardar(favoritas); pintar();
  }
}

/* Antes esto pedia la direccion exacta y salia "pagina no disponible"
   en cuanto se escribia "el corte ingles" en vez de "elcorteingles.es".
   Nadie se sabe las direcciones de memoria. Ahora vale escribir lo que
   sea: si no parece una direccion, se guarda como busqueda y funciona
   igual. */
function anadir(){
  var nom = prompt('¿Cómo quiere llamarla?\n(por ejemplo: Mi banco, El periódico)');
  if(!nom) return;
  var dir = prompt('¿Qué página es?\nPuede escribir el nombre a secas:\nel corte inglés, mi ayuntamiento...');
  if(!dir) return;
  favoritas.push({ ic:'⭐', nom:nom.trim(), des:'', url:aDireccion(dir), fija:false, color:'gris' });
  guardar(favoritas); pintar();
}

/* Convierte lo que sea en algo que se pueda abrir sin fallar */
function aDireccion(v){
  v = String(v).trim();
  if(/^[^\s]+\.[a-z]{2,}(\/|$)/i.test(v)){
    return /^https?:\/\//i.test(v) ? v : 'https://' + v;
  }
  return 'https://duckduckgo.com/?kl=es-es&q=' + encodeURIComponent(v);
}

/* Guardar la pagina en la que uno esta: es la forma natural de hacer
   favoritos, sin tener que escribir ninguna direccion. La llama la
   barra de ayuda desde dentro de la web. */
function guardarPagina(url, nombre){
  favoritas.push({ ic:'⭐', nom:nombre, des:'', url:url, fija:false, color:'gris' });
  guardar(favoritas); pintar();
}

/* Buscador, no barra de direcciones: nadie escribe "www punto lo que sea
   punto es" sin equivocarse en un teclado pequeño. DuckDuckGo a
   proposito, que no monta muro de cookies. */
function irADireccion(){
  var v = document.getElementById('dir').value.trim();
  if(!v) return;
  location.href = aDireccion(v);
}
document.getElementById('dir').addEventListener('keydown', function(e){
  if(e.key === 'Enter') irADireccion();
});

pintar();
</script>
</body>
</html>
