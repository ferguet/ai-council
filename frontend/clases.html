<!DOCTYPE html>
<!--
  CLASES DESDE EL ORDENADOR.

  Esto sustituye a la "app para PC" que haria falta si no existiera:
  graba con el microfono del ordenador, sube ficheros de audio, enseña
  las clases guardadas, y descarga o imprime los apuntes en PDF.

  Es una pagina web a proposito, no un programa que instalar:
   - Funciona en cualquier ordenador sin instalar nada.
   - El PDF sale gratis, porque el navegador ya sabe imprimir a PDF; no
     hay que escribir ni mantener un generador de PDF.
   - Se actualiza sola: al estar servida desde el mismo sitio que el
     resto, no hay versiones viejas dando vueltas por ahi.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clases</title>
<style>
  :root { --fondo:#101828; --panel:#1C2434; --texto:#E7ECF3; --suave:#9AA4B2; --linea:#2A3648; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto);
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .caja { max-width:900px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .sub { color:var(--suave); font-size:15px; margin-bottom:24px; }
  .panel { background:var(--panel); border-radius:16px; padding:20px; margin-bottom:18px; }
  .et { font-size:12px; letter-spacing:.08em; color:#7E8AA0; text-transform:uppercase; margin-bottom:10px; }
  input[type=text] { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--linea);
                     background:#141C2A; color:var(--texto); font-size:15px; }
  button { border:0; border-radius:12px; padding:13px 18px; font-size:15px; font-weight:600;
           color:#fff; cursor:pointer; margin:6px 6px 0 0; }
  .verde{background:#0B7A3B;} .rojo{background:#B91C1C;} .azul{background:#1D4ED8;}
  .morado{background:#7C2D6E;} .gris{background:#243044;}
  button:disabled { opacity:.45; cursor:default; }
  #estado { margin-top:12px; font-size:15px; white-space:pre-line; }
  #texto { white-space:pre-wrap; line-height:1.55; font-size:15px; background:#141C2A;
           border-radius:12px; padding:18px; min-height:120px; }
  .lista button { display:block; width:100%; text-align:left; font-weight:400; font-size:14px; }
  #crono { font-size:34px; font-variant-numeric:tabular-nums; }
  /* Al imprimir solo sale el texto: nada de botones ni menus en el papel. */
  @media print {
    body { background:#fff; color:#000; }
    .panel, .sub, h1, #estado { display:none; }
    #panelTexto { display:block !important; background:#fff; padding:0; }
    #texto { background:#fff; color:#000; font-size:12pt; }
    #tituloImpreso { display:block !important; font-size:16pt; margin-bottom:12pt; }
    #cabecera { background:#fff !important; color:#000 !important; border-left:3px solid #000; }
  }
  #tituloImpreso { display:none; }
</style>
</head>
<body>
<div class="caja">
  <h1>Clases</h1>
  <div class="sub">Graba o sube una clase, y se transcribe sola. Sin datos de pacientes: esto es para clases y estudio.</div>

  <div class="panel">
    <div class="et">Servidor</div>
    <input type="text" id="servidor">
    <button class="gris" onclick="probar()">🔌 Probar la conexión</button>
  </div>

  <div class="panel">
    <div class="et">Nueva clase</div>
    <input type="text" id="asignatura" placeholder="Asignatura (opcional)">
    <div id="crono"></div>
    <button class="verde" id="btnGrabar" onclick="alternarGrabacion()">🎙️ Empezar a grabar</button>
    <button class="azul" onclick="document.getElementById('fichero').click()">📂 Subir un audio</button>
    <input type="file" id="fichero" accept="audio/*" style="display:none" onchange="subirFichero(this.files[0])">
    <div id="estado">Listo.</div>
  </div>

  <div class="panel" id="panelTexto">
    <div class="et">Texto</div>
    <!-- QUE DOCUMENTO ESTOY MIRANDO.
         Antes el texto aparecia a secas y habia que adivinar de que
         grabacion era: con varias clases guardadas es facil abrir una y
         creer que estas leyendo otra. Un texto sin decir de donde sale
         obliga a comprobarlo cada vez. -->
    <div id="cabecera" style="background:#141C2A;border-left:4px solid #1D4ED8;
         border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px;
         line-height:1.5;color:#9AA4B2">Todavía no ha abierto nada.</div>
    <div id="tituloImpreso"></div>
    <div id="texto">Todavía no hay nada que enseñar.</div>
    <button class="morado" id="btnResumir" onclick="resumir()" disabled>📝 Resumir en apuntes</button>
    <button class="gris" onclick="window.print()">🖨️ Imprimir o guardar en PDF</button>
    <button class="gris" onclick="descargar()">⬇️ Descargar como texto</button>
    <button class="gris" id="btnCopiar" onclick="copiar()">📋 Copiar todo el texto</button>
    <button class="azul" id="btnDiapos" onclick="document.getElementById('pdf').click()" disabled>📊 Cruzar con las diapositivas (PDF)</button>
    <input type="file" id="pdf" accept="application/pdf" style="display:none" onchange="cruzar(this.files[0])">
    <button class="verde" id="btnExamen" onclick="preguntas(null)" disabled>❓ Proponer preguntas de examen</button>
    <button class="gris" id="btnExamenPdf" onclick="document.getElementById('pdfex').click()" disabled>📎 …usando exámenes que yo suba</button>
    <input type="file" id="pdfex" accept="application/pdf" style="display:none" onchange="preguntas(this.files[0])">
    <div id="estado2" style="margin-top:12px;font-size:14px;white-space:pre-line;color:#9AA4B2"></div>
  </div>

  <div class="panel">
    <div class="et">Clases guardadas</div>
    <div class="lista" id="lista">—</div>
    <button class="gris" onclick="cargarLista(true)">🔄 Actualizar</button>
  </div>
</div>

<script>
// La direccion se recuerda en el navegador, y se puede cambiar a mano:
// igual que en el movil, saber a donde llama la pagina no deberia ser un
// misterio cuando algo falla.
const guardado = localStorage.getItem('clases_servidor');
const campoServidor = document.getElementById('servidor');
campoServidor.value = guardado || window.location.origin;

function base() {
  const v = campoServidor.value.trim().replace(/\/+$/, '');
  localStorage.setItem('clases_servidor', v);
  return v;
}

const estado = document.getElementById('estado');
const salida = document.getElementById('texto');
const btnResumir = document.getElementById('btnResumir');
let ficheroVisible = null;

function di(msg, color) {
  // Se escribe en los DOS sitios: arriba y junto a los botones de abajo.
  // La pagina es larga y el aviso quedaba fuera de la pantalla justo
  // cuando mas falta hacia.
  estado.textContent = msg;
  estado.style.color = color || '#9AA4B2';
  const e2 = document.getElementById('estado2');
  if (e2) { e2.textContent = msg; e2.style.color = color || '#9AA4B2'; }
}

async function probar() {
  di('⏳ Probando ' + base() + ' …\n(si el servidor estaba dormido tarda hasta un minuto)', '#FACC15');
  try {
    const r = await fetch(base() + '/clases/listar');
    if (!r.ok) throw new Error('El servidor respondió ' + r.status);
    const d = await r.json();
    di('✅ El servidor contesta.\n' + base() +
       '\nClases guardadas: ' + d.clases.length +
       '\nSe guardan en: ' + (d.guardado_en || '?'), '#4ADE80');
    pintarLista(d.clases);
  } catch (e) {
    di('❌ No contesta.\nDirección: ' + base() + '\nMotivo: ' + e.message, '#F87171');
  }
}

// ---------- grabar con el microfono del ordenador ----------
let grabador = null, trozos = [], desde = 0, tic = null;

async function alternarGrabacion() {
  const btn = document.getElementById('btnGrabar');
  if (grabador && grabador.state === 'recording') {
    grabador.stop();
    return;
  }
  try {
    const flujo = await navigator.mediaDevices.getUserMedia({ audio: true });
    trozos = [];
    grabador = new MediaRecorder(flujo);
    grabador.ondataavailable = e => { if (e.data.size) trozos.push(e.data); };
    grabador.onstop = () => {
      clearInterval(tic);
      document.getElementById('crono').textContent = '';
      flujo.getTracks().forEach(t => t.stop());
      btn.textContent = '🎙️ Empezar a grabar';
      btn.className = 'verde';
      const blob = new Blob(trozos, { type: grabador.mimeType || 'audio/webm' });
      enviar(blob, 'clase.webm');
    };
    grabador.start();
    desde = Date.now();
    tic = setInterval(() => {
      const s = Math.floor((Date.now() - desde) / 1000);
      document.getElementById('crono').textContent =
        String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 500);
    btn.textContent = '⏹️ Parar y transcribir';
    btn.className = 'rojo';
    di('🔴 Grabando…', '#F87171');
  } catch (e) {
    di('❌ No se pudo usar el micrófono: ' + e.message, '#F87171');
  }
}

function subirFichero(f) { if (f) enviar(f, f.name); }

async function enviar(blob, nombre) {
  const mb = (blob.size / 1048576).toFixed(1);
  di('⏳ Transcribiendo ' + nombre + ' (' + mb + ' MB)…\n' +
     'Las clases largas se parten en trozos, así que puede tardar varios minutos.', '#FACC15');
  const fd = new FormData();
  fd.append('audio', blob, nombre);
  try {
    const r = await fetch(base() + '/clases/transcribir?asignatura=' +
                          encodeURIComponent(document.getElementById('asignatura').value || 'sin_asignatura'),
                          { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('error ' + r.status));
    salida.textContent = d.texto;
    pintarCabecera(d.fichero);
    seleccionar(d.fichero);
    document.getElementById('tituloImpreso').textContent = d.fichero;
    di('✅ Transcrito y guardado (' + d.fichero + ')', '#4ADE80');
    cargarLista();
  } catch (e) {
    di('❌ ' + e.message, '#F87171');
  }
}

let vigilante = null;

async function resumir() {
  if (!ficheroVisible) return;
  const cual = ficheroVisible;
  btnResumir.disabled = true;
  di('⏳ Convirtiendo en apuntes…', '#FACC15');

  // Se pregunta al servidor por donde va, cada 3 segundos. El porcentaje
  // es real -partes resumidas de partes totales-, no una barra decorativa
  // que avanza sola sin saber nada.
  vigilante = setInterval(async () => {
    try {
      const p = await (await fetch(base() + '/clases/progreso/' + encodeURIComponent(cual))).json();
      if (p.estado === 'trabajando') {
        di('⏳ Resumiendo… ' + p.porcentaje + '%  (parte ' + p.parte + ' de ' + p.total + ')', '#FACC15');
        btnResumir.textContent = '📝 Resumiendo… ' + p.porcentaje + '%';
      }
    } catch (e) {}
  }, 3000);

  try {
    const r = await fetch(base() + '/clases/resumir/' + encodeURIComponent(ficheroVisible), { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('error ' + r.status));
    salida.textContent = d.resumen;
    pintarCabecera(d.fichero);
    ficheroVisible = null;
    di('✅ Apuntes listos (' + d.fichero + ')' + (d.partes > 1 ? ' — resumido en ' + d.partes + ' partes' : ''), '#4ADE80');
    cargarLista();
  } catch (e) {
    di('❌ ' + e.message, '#F87171');
    btnResumir.disabled = false;
  } finally {
    clearInterval(vigilante);
    btnResumir.textContent = '📝 Resumir en apuntes';
  }
}

// CRUZAR LA CLASE CON LAS DIAPOSITIVAS DEL PROFESOR.
//
// Ninguna de las dos señales vale gran cosa por separado: que algo este
// en negrita puede ser costumbre del profesor, y que lo mencione en clase
// puede ser de pasada. Lo que dice algo es que COINCIDAN las dos.
async function cruzar(f) {
  if (!f || !ficheroVisible) return;
  di('⏳ Leyendo las diapositivas y cruzándolas con la clase…\n' +
     'Esto mira qué ha resaltado el profesor (negrita, color, letra grande) ' +
     'y lo compara con lo que explicó en voz alta.', '#FACC15');
  const cual = ficheroVisible;
  const btn = document.getElementById('btnDiapos');
  btn.disabled = true;

  // Mismo porcentaje real que en el resumen: partes hechas de partes
  // totales, contadas por el servidor.
  const ojo = setInterval(async () => {
    try {
      const p = await (await fetch(base() + '/clases/progreso/' + encodeURIComponent(cual))).json();
      if (p.estado === 'trabajando') {
        di('⏳ Cruzando… ' + p.porcentaje + '%  (parte ' + p.parte + ' de ' + p.total + ')', '#FACC15');
        btn.textContent = '📊 Cruzando… ' + p.porcentaje + '%';
      }
    } catch (e) {}
  }, 3000);

  const fd = new FormData();
  fd.append('pdf', f, f.name);
  try {
    const r = await fetch(base() + '/clases/diapositivas/' + encodeURIComponent(ficheroVisible),
                          { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('error ' + r.status));
    salida.textContent = d.guia;
    pintarCabecera(d.fichero);
    di('✅ Guía de prioridades lista.\n' +
       d.resaltados + ' cosas resaltadas en ' + d.paginas + ' páginas, cruzadas con la clase en ' +
       d.partes + ' partes' +
       (d.recortado ? ' (el PDF era muy largo y solo se han mirado las primeras).' : '.'),
       '#4ADE80');
    cargarLista();
  } catch (e) {
    di('❌ ' + e.message, '#F87171');
  } finally {
    clearInterval(ojo);
    btn.textContent = '📊 Cruzar con las diapositivas (PDF)';
    btn.disabled = false;
  }
  document.getElementById('pdf').value = '';
}

// PREGUNTAS TIPO EXAMEN SOBRE LA CLASE.
//
// Dos vias porque la realidad es asi: a veces se tienen los examenes
// anteriores y se suben, y muchas otras no se tienen. Si no hay, se
// buscan en internet los del MIR sobre esos temas. Y si tampoco hay
// nada, se generan solo con la clase, DICIENDOLO -sirve para repasar
// igual, pero la persona tiene que saber que van sin respaldo-.
async function preguntas(f) {
  const cual = baseSeleccionada || ficheroVisible;
  if (!cual) { di('Abra primero una clase de la lista.', '#F87171'); return; }
  const b1 = document.getElementById('btnExamen'), b2 = document.getElementById('btnExamenPdf');
  b1.disabled = b2.disabled = true;
  // El aviso tiene que estar DONDE se ha pulsado. Estaba solo arriba del
  // todo, asi que habia que subir la pagina para saber si estaba
  // trabajando: un boton que no reacciona parece un boton roto.
  const textoOriginal = f ? b2.textContent : b1.textContent;
  (f ? b2 : b1).textContent = '⏳ Trabajando…';
  let punto = 0;
  const late = setInterval(() => {
    punto = (punto + 1) % 4;
    (f ? b2 : b1).textContent = '⏳ Trabajando' + '.'.repeat(punto);
  }, 600);
  di(f ? '⏳ Leyendo sus exámenes y preparando preguntas…'
       : '⏳ Buscando preguntas del MIR sobre estos temas y preparando el test…\n' +
         'Puede tardar un minuto.', '#FACC15');
  try {
    const fd = new FormData();
    if (f) fd.append('pdf', f, f.name);
    // Un formulario SIN NINGUN campo no es un cuerpo valido, y el
    // servidor contestaba "error parsing the body" al pedir preguntas sin
    // subir examenes -que es justo el caso normal-. Con un campo suelto
    // el envio ya es valido; el servidor lo ignora.
    fd.append('_', '1');
    const r = await fetch(base() + '/clases/examen/' + encodeURIComponent(cual),
                          { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || ('error ' + r.status));
    // LA FUENTE DENTRO DEL TEXTO, NO SOLO EN EL AVISO DE ARRIBA.
    //
    // Antes "Basado en: ..." solo salia en el aviso de estado, que se
    // borra en cuanto se hace otra cosa y no viaja si se copia, se
    // descarga o se imprime -que es para lo que sirve este boton-. Y la
    // IA, al escribir sus preguntas, no siempre se acordaba de mencionar
    // que tenia un examen real delante: podia abrir con "basadas en la
    // clase" aunque tambien hubiera un PDF de examenes leido. Ahora el
    // servidor manda una cabecera fija que no depende de la IA, y va
    // DENTRO del texto como primera linea: se copia, se imprime y se
    // guarda siempre junto con las preguntas.
    salida.textContent = (d.cabecera ? d.cabecera + '\n\n' : '') + d.preguntas;
    pintarCabecera(d.fichero);
    let msg = '✅ Preguntas listas.';
    if (d.diario && d.diario.length) msg += '\n' + d.diario.join('\n');
    di(msg, '#4ADE80');
    cargarLista();
  } catch (e) {
    di('❌ ' + e.message, '#F87171');
  } finally {
    clearInterval(late);
    (f ? b2 : b1).textContent = textoOriginal;
    b1.disabled = b2.disabled = false;
    document.getElementById('pdfex').value = '';
  }
}

// Fecha legible a partir del nombre "2026-08-01_1637_Oftalmologia.txt"
function describir(n) {
  const info = queEs(n);
  const m = nombreBase(n).match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})_(.*)$/);
  let cuando = '', asig = '';
  if (m) {
    cuando = m[3] + '/' + m[2] + '/' + m[1] + ' a las ' + m[4] + ':' + m[5];
    asig = m[6].replace(/_/g, ' ');
    if (asig === 'sin asignatura') asig = '(sin asignatura)';
  }
  return { info, cuando, asig };
}

function pintarCabecera(n) {
  const d = describir(n);
  document.getElementById('cabecera').innerHTML =
    '<div style="color:#E7ECF3;font-size:16px"><b>' + d.info.icono + '  ' + d.info.nombre + '</b></div>' +
    '<div>' + d.info.pista + '</div>' +
    (d.cuando ? '<div style="margin-top:6px">📅 Clase grabada el <b>' + d.cuando + '</b></div>' : '') +
    (d.asig ? '<div>📚 Asignatura: <b>' + d.asig + '</b></div>' : '') +
    '<div style="font-size:11px;opacity:.6;margin-top:6px">' + n + '</div>';
  document.getElementById('tituloImpreso').textContent =
    d.info.nombre + (d.asig ? ' — ' + d.asig : '') + (d.cuando ? ' — ' + d.cuando : '');
}

// COPIAR EL TEXTO ENTERO.
//
// Para seguir trabajando con estos apuntes en otro sitio -otra IA, un
// documento propio, un correo a un compañero-. El material es suyo: no
// tiene sentido que se quede encerrado aqui dentro.
async function copiar() {
  const b = document.getElementById('btnCopiar');
  try {
    await navigator.clipboard.writeText(salida.textContent);
    b.textContent = '✅ Copiado';
  } catch (e) {
    // Si el navegador no deja usar el portapapeles (pasa sin HTTPS), se
    // selecciona el texto para que baste con Ctrl+C, en vez de dejar a la
    // persona con un boton que no hace nada.
    const r = document.createRange();
    r.selectNodeContents(salida);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    b.textContent = '👆 Seleccionado: pulse Ctrl+C';
  }
  setTimeout(() => { b.textContent = '📋 Copiar todo el texto'; }, 2500);
}

function descargar() {
  const nombre = (document.getElementById('tituloImpreso').textContent || 'clase') .replace(/\.txt$/, '') + '.txt';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([salida.textContent], { type: 'text/plain;charset=utf-8' }));
  a.download = nombre;
  a.click();
}

async function cargarLista(avisar) {
  // Si no se dice nada al pulsar, el boton parece roto aunque funcione:
  // la lista se repinta igual que estaba y no se ve ningun cambio.
  if (avisar) di('⏳ Consultando la lista…', '#FACC15');
  try {
    const r = await fetch(base() + '/clases/listar');
    if (!r.ok) throw new Error('el servidor respondió ' + r.status);
    const d = await r.json();
    pintarLista(d.clases);
    if (avisar) di('✅ Lista actualizada: ' + d.clases.length + ' guardadas.', '#4ADE80');
  } catch (e) {
    document.getElementById('lista').textContent = 'No se pudo consultar la lista.';
    if (avisar) di('❌ No se pudo consultar la lista.\n' + e.message, '#F87171');
  }
}

// LA LISTA, AGRUPADA POR CLASE Y CON NOMBRES QUE SE ENTIENDEN.
//
// Antes salia todo mezclado y distinguido solo por un icono, y la
// pregunta que llego fue la correcta: "no se a que se refiere cada uno".
// Un icono no explica nada por si solo. Ahora cada clase es un bloque y
// dentro se dice CON PALABRAS que es cada cosa.
function nombreBase(n) {
  return n.replace(/_resumen\.txt$/, '').replace(/_prioridades\.txt$/, '').replace(/_examen\.txt$/, '').replace(/\.txt$/, '');
}

function queEs(n) {
  if (n.endsWith('_resumen.txt'))     return { icono: '📝', nombre: 'Apuntes resumidos',      pista: 'La clase ordenada por conceptos' };
  if (n.endsWith('_prioridades.txt')) return { icono: '📊', nombre: 'Qué estudiar primero',   pista: 'Cruce con las diapositivas del profesor' };
  if (n.endsWith('_examen.txt'))      return { icono: '❓', nombre: 'Posibles preguntas',      pista: 'Preguntas tipo examen sobre esta clase' };
  return                                     { icono: '🎙️', nombre: 'Grabación transcrita',  pista: 'Lo que se dijo, palabra por palabra' };
}

function pintarLista(clases) {
  const c = document.getElementById('lista');
  c.innerHTML = '';
  if (!clases || !clases.length) { c.textContent = 'Todavía no hay clases guardadas.'; return; }

  // Agrupar: cada grabación con todo lo que se ha sacado de ella debajo.
  const grupos = {};
  clases.forEach(n => { (grupos[nombreBase(n)] = grupos[nombreBase(n)] || []).push(n); });

  Object.keys(grupos).sort().reverse().forEach(claseBase => {
    const cab = document.createElement('div');
    cab.textContent = claseBase.replace(/_/g, ' ');
    cab.style.cssText = 'margin:16px 0 6px;font-size:13px;color:#7E8AA0;letter-spacing:.04em';
    c.appendChild(cab);

    grupos[claseBase].sort().forEach(n => {
      const info = queEs(n);
      const fila = document.createElement('div');
      fila.style.cssText = 'display:flex;gap:6px;align-items:stretch';

      const b = document.createElement('button');
      b.className = 'gris';
      b.style.cssText = 'flex:1;text-align:left;line-height:1.35';
      b.innerHTML = '<div>' + info.icono + '  <b>' + info.nombre + '</b></div>' +
                    '<div style="font-size:12px;opacity:.7">' + info.pista + '</div>';
      b.onclick = async () => {
        di('Cargando…');
        try {
          const r = await fetch(base() + '/clases/leer/' + encodeURIComponent(n));
          const d = await r.json();
          salida.textContent = d.texto;
          pintarCabecera(n);
          seleccionar(n);
          di('Mostrando: ' + info.nombre + ' — ' + claseBase.replace(/_/g, ' '));
        } catch (e) { di('❌ ' + e.message, '#F87171'); }
      };

      const x = document.createElement('button');
      x.className = 'gris';
      x.textContent = '🗑️';
      x.style.cssText = 'width:52px;flex:0 0 auto';
      x.onclick = async (ev) => {
        ev.stopPropagation();
        if (!confirm('¿Borrar «' + info.nombre + '» de ' + base.replace(/_/g, ' ') + '?\n\nEsto no se puede deshacer.')) return;
        try {
          const r = await fetch(base() + '/clases/borrar/' + encodeURIComponent(n), { method: 'DELETE' });
          if (!r.ok) throw new Error('el servidor respondió ' + r.status);
          di('🗑️ Borrado.', '#9AA4B2');
          cargarLista();
        } catch (e) { di('❌ No se pudo borrar.\n' + e.message, '#F87171'); }
      };

      fila.appendChild(b);
      fila.appendChild(x);
      c.appendChild(fila);
    });
  });
}

// QUE SE PUEDA CRUZAR TAMBIEN DESDE UN RESUMEN.
//
// Antes, al abrir unos apuntes o unas prioridades, el boton de cruzar se
// apagaba. Y no tenia sentido: la transcripcion original sigue estando
// ahi, solo hacia falta saber cual era. Apagar un boton porque estas
// mirando un derivado del mismo material es ponerle una traba a la
// persona por una limitacion mia, no suya.
let baseSeleccionada = null;

function seleccionar(n) {
  const derivado = n.endsWith('_resumen.txt') || n.endsWith('_prioridades.txt') || n.endsWith('_examen.txt');
  baseSeleccionada = derivado ? nombreBase(n) + '.txt' : n;
  ficheroVisible = derivado ? null : n;          // resumir solo tiene sentido sobre la transcripcion
  btnResumir.disabled = derivado;
  // Cruzar y examinar SI valen siempre: trabajan sobre la transcripcion
  // original, que existe se este mirando lo que se este mirando.
  document.getElementById('btnDiapos').disabled = false;
  const be = document.getElementById('btnExamen');
  if (be) be.disabled = false;
}

cargarLista();
</script>
