<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>AI Council</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d17" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Ciudad IA" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<script src="access.js"></script>
<style>
  :root {
    --bg0:#0a0b16; --bg1:#12132a; --bg2:#1a1140;
    --glass: rgba(28,30,54,0.55);
    --glass-strong: rgba(30,32,60,0.8);
    --border: rgba(255,255,255,0.10);
    --border-lit: rgba(255,255,255,0.22);
    --text:#eef1fb; --muted:#a2a7c4;
    --a1:#7c5cff; --a2:#20c5ff; --a3:#ff5ca8; --a4:#39e0a6; --a5:#ffcb47;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(124,92,255,0.35), transparent 60%),
      radial-gradient(900px 600px at -10% 20%, rgba(32,197,255,0.22), transparent 55%),
      radial-gradient(900px 700px at 50% 120%, rgba(255,92,168,0.20), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg2));
    background-attachment: fixed;
    height: 100vh; height: 100dvh; display: flex;
  }
  button { font-family: inherit; }
  #setup {
    width: 380px; min-width: 380px; border-right: 1px solid var(--border);
    padding: 18px; overflow-y: auto;
    background: linear-gradient(180deg, rgba(12,13,28,0.6), rgba(12,13,28,0.3));
    backdrop-filter: blur(18px) saturate(140%);
  }
  #setup h1 { font-size: 19px; margin: 0 0 10px; letter-spacing: .2px; }

  /* ---------- Nav a las otras pantallas: antes eran enlaces de texto
     subrayados que se veian cutres; ahora son pildoras iguales al resto
     de la app (index.html/city.html). ---------- */
  #pageNav { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; }
  #pageNav a, #pageNav span {
    display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px;
    border-radius: 20px; background: var(--glass); border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; text-decoration: none; backdrop-filter: blur(10px);
  }
  #pageNav span.active { color: var(--text); border-color: var(--border-lit); background: rgba(124,92,255,.22); }
  #pageNav a:hover { color: var(--text); border-color: var(--border-lit); }

  label { display: block; font-size: 11px; color: var(--muted); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: .06em; }
  input[type=text], textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: #ffffff0d; color: var(--text); font-size: 13px; outline: none;
  }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--border-lit); }
  textarea { resize: vertical; min-height: 50px; }
  .agent-card {
    border: 1px solid var(--border); border-radius: 14px; padding: 11px; margin-top: 10px;
    background: var(--glass); backdrop-filter: blur(10px);
  }
  .agent-card-head { display: flex; justify-content: space-between; align-items: center; }
  .agent-card-head input { background: transparent !important; border: none !important; padding: 2px 0 !important; }
  .agent-card-head button { background: none; border: none; color: var(--a3); cursor: pointer; font-size: 16px; }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  button.primary {
    width: 100%; margin-top: 18px; padding: 12px; border-radius: 14px; border: none;
    background: linear-gradient(135deg,var(--a1),var(--a3)); color: white; font-weight: 600;
    cursor: pointer; font-size: 14px; box-shadow: 0 6px 16px rgba(124,92,255,.4);
  }
  button.primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  button.secondary {
    width: 100%; margin-top: 8px; padding: 9px; border-radius: 12px; border: 1px dashed var(--border-lit);
    background: #ffffff0a; color: var(--muted); cursor: pointer; font-size: 12.5px;
  }
  button.secondary:hover { color: var(--text); }

  /* ---------- Adjuntar documento ---------- */
  .att-chip {
    display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 11px;
    border-radius: 12px; background: rgba(57,224,166,.12); border: 1px solid rgba(57,224,166,.35);
    font-size: 12px;
  }
  .att-chip .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-chip button { background: none; border: none; color: var(--a3); cursor: pointer; font-size: 14px; }
  .att-hint { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    padding: 14px 22px; border-bottom: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center;
    backdrop-filter: blur(18px) saturate(140%);
    background: linear-gradient(180deg, rgba(12,13,28,0.5), rgba(12,13,28,0.15));
  }
  #topbar .status { font-size: 11.5px; color: var(--muted); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }
  #chat { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.48; }
  .msg .who { font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: .85; }
  .msg.agent { background: var(--glass); align-self: flex-start; border: 1px solid var(--border); border-left: 3px solid var(--a1); border-bottom-left-radius: 4px; backdrop-filter: blur(10px); }
  .msg.user { background: linear-gradient(135deg,var(--a1),#5b45d6); align-self: flex-end; color: white; border-bottom-right-radius: 4px; }
  .msg.director { background: transparent; align-self: center; color: var(--muted); font-style: italic; font-size: 12px; border: 1px dashed var(--border); }
  .msg.system { background: transparent; align-self: center; color: var(--a3); font-size: 12px; }
  #composer { padding: 14px 22px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #composer input { flex: 1; }
  #composer button { padding: 0 20px; border-radius: 14px; border: none; background: linear-gradient(135deg,var(--a1),var(--a3)); color: white; cursor: pointer; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 14px; line-height: 1.6; }
  .typing { font-size: 12px; color: var(--muted); font-style: italic; padding: 0 22px 8px; min-height: 18px; }

  /* ---------- Movil: el sidebar fijo de 380px no cabe en una pantalla de
     telefono (deja el chat exprimido a casi nada, letras cortadas y todo
     amontonado). Por debajo de 760px se apila: la configuracion arriba,
     colapsable, el chat debajo ocupando el resto. ---------- */
  @media (max-width: 760px) {
    body { flex-direction: column; height: 100vh; height: 100dvh; }
    #setup {
      width: 100%; min-width: 0; max-height: 46vh; max-height: 46dvh;
      border-right: none; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #main { min-height: 0; }
    .msg { max-width: 88%; }
    #topbar { padding: 12px 14px; }
    #chat { padding: 14px 16px; }
    #composer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div id="setup">
  <h1>🗳️ AI Council</h1>
  <div id="pageNav">
    <a href="index.html">💬 Chat</a>
    <a href="city.html">🏙️ Ciudad</a>
    <span class="active">🗳️ Debate</span>
  </div>

  <label>Tema del debate</label>
  <textarea id="topic" placeholder="Ej: ¿Deberíamos invertir en esta empresa?"></textarea>

  <label>Adjuntar documento (opcional)</label>
  <button class="secondary" type="button" id="attachDebateBtn">📎 Adjuntar documento</button>
  <input type="file" id="debateFileInput" style="display:none"
    accept=".pdf,.docx,.xlsx,.csv,.tsv,.zip,.txt,.md,.json,.py,.js,.ts,.java,.c,.cpp,.go,.rs,.rb,.php,.sh,.sql" />
  <div id="debateAttachBox"></div>
  <p class="att-hint">Su contenido se añade al tema para que todas las IA lo tengan en cuenta al debatir.</p>

  <div id="agents"></div>
  <button class="secondary" onclick="addAgentCard()">+ Añadir participante</button>

  <button class="primary" id="startBtn" onclick="startDebate()">Iniciar debate</button>
  <p class="att-hint" style="margin-top:10px;">Prueba primero con proveedor <b>mock</b>: funciona sin ninguna API key.</p>
</div>

<div id="main">
  <div id="topbar">
    <strong id="topicLabel">Sin debate activo</strong>
    <span class="status" id="statusLabel"></span>
  </div>
  <div id="chat"><div class="empty">Configura el debate a la izquierda y pulsa "Iniciar debate".</div></div>
  <div class="typing" id="typingLabel"></div>
  <div id="composer">
    <input type="text" id="userInput" placeholder="Interviene en el debate en cualquier momento..." disabled />
    <button onclick="sendUserMessage()">Enviar</button>
  </div>
</div>

<script>
const ROLES = ["Generalista","Médico","Abogado","Programador","Economista","Profesor","Psicólogo","Investigador","Ingeniero"];
const PROVIDERS = ["mock","gemini","groq","deepseek","glm","ollama","openai","anthropic"];
const DEFAULT_MODELS = {mock:"mock-v1", gemini:"gemini-3.6-flash", groq:"llama-3.3-70b-versatile", deepseek:"deepseek-v4-flash", glm:"glm-4.7-flash", ollama:"llama3", openai:"gpt-4o-mini", anthropic:"claude-3-5-sonnet-latest"};
let agentCount = 0;
let ws = null;
let debateAttachment = null; // {filename, extracted_text} o null

/* ---------------- Adjuntar documento ---------------- */
document.getElementById("attachDebateBtn").onclick = () => document.getElementById("debateFileInput").click();
document.getElementById("debateFileInput").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const btn = document.getElementById("attachDebateBtn");
  btn.disabled = true;
  btn.textContent = "📎 Leyendo...";
  try {
    const fd = new FormData();
    fd.append("file", f);
    const r = await AIAccess.fetch("/debate/extract", { method: "POST", body: fd });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      alert(body.detail || "No se pudo leer el documento.");
    } else {
      debateAttachment = { filename: body.filename, extracted_text: body.extracted_text };
      renderDebateAttach();
    }
  } catch (err) {
    alert("Error subiendo el archivo: " + err);
  }
  btn.disabled = false;
  btn.textContent = "📎 Adjuntar documento";
});
function renderDebateAttach() {
  const box = document.getElementById("debateAttachBox");
  if (!debateAttachment) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="att-chip"><span>📄</span><span class="nm">${debateAttachment.filename}</span><button onclick="removeDebateAttach()">✕</button></div>`;
}
function removeDebateAttach() { debateAttachment = null; renderDebateAttach(); }

function addAgentCard(name, role, provider) {
  agentCount++;
  const id = "agent_" + agentCount;
  const div = document.createElement("div");
  div.className = "agent-card";
  div.id = id;
  div.innerHTML = `
    <div class="agent-card-head">
      <input type="text" style="font-weight:600;border:none;background:transparent;padding:2px 0;width:70%;" value="${name || ('Agente ' + agentCount)}" data-field="name" />
      <button onclick="document.getElementById('${id}').remove()">✕</button>
    </div>
    <div class="row2">
      <div>
        <label>Rol</label>
        <select data-field="role">
          ${ROLES.map(r => `<option ${r===(role||"Generalista")?"selected":""}>${r}</option>`).join("")}
        </select>
      </div>
      <div>
        <label>Proveedor</label>
        <select data-field="provider" onchange="onProviderChange('${id}')">
          ${PROVIDERS.map(p => `<option value="${p}" ${p===(provider||"mock")?"selected":""}>${p}</option>`).join("")}
        </select>
      </div>
    </div>
    <label>Modelo</label>
    <input type="text" data-field="model" value="${DEFAULT_MODELS[provider||"mock"]}" />
  `;
  document.getElementById("agents").appendChild(div);
}

function onProviderChange(id) {
  const card = document.getElementById(id);
  const provider = card.querySelector('[data-field=provider]').value;
  card.querySelector('[data-field=model]').value = DEFAULT_MODELS[provider] || "";
}

function collectAgents() {
  return [...document.querySelectorAll(".agent-card")].map(card => ({
    name: card.querySelector('[data-field=name]').value || "Agente",
    role: card.querySelector('[data-field=role]').value,
    provider: card.querySelector('[data-field=provider]').value,
    model: card.querySelector('[data-field=model]').value,
  }));
}

function addMessage(cls, who, content) {
  const chat = document.getElementById("chat");
  const empty = chat.querySelector(".empty");
  if (empty) empty.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = `<div class="who">${who}</div><div class="content"></div>`;
  div.querySelector(".content").textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

const agentColors = {};
const streamingDivs = {};

function startDebate() {
  const topic = document.getElementById("topic").value.trim();
  const agents = collectAgents();
  if (!topic || agents.length === 0) {
    alert("Pon un tema y al menos un participante.");
    return;
  }
  let finalTopic = topic;
  if (debateAttachment && debateAttachment.extracted_text) {
    finalTopic += `\n\n--- documento adjunto: ${debateAttachment.filename} ---\n${debateAttachment.extracted_text}`;
  }
  document.getElementById("startBtn").disabled = true;
  document.getElementById("chat").innerHTML = "";
  document.getElementById("topicLabel").textContent = topic;
  document.getElementById("statusLabel").textContent = "conectando...";

  const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + (window.AI_COUNCIL_HOST || location.host || "localhost:8000") + "/ws/debate" + AIAccess.wsParam();
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    ws.send(JSON.stringify({ topic: finalTopic, participants: agents }));
    document.getElementById("statusLabel").textContent = "en directo";
    document.getElementById("userInput").disabled = false;
  };

  ws.onmessage = (evt) => {
    const { type, payload } = JSON.parse(evt.data);
    handleEvent(type, payload);
  };

  ws.onclose = () => {
    document.getElementById("statusLabel").textContent = "desconectado";
    document.getElementById("startBtn").disabled = false;
  };

  ws.onerror = () => {
    document.getElementById("statusLabel").textContent = "error de conexión";
  };
}

function handleEvent(type, payload) {
  const typingLabel = document.getElementById("typingLabel");
  switch (type) {
    case "session_started":
      payload.participants.forEach(p => agentColors[p.id] = p.color);
      break;
    case "agent_typing":
      typingLabel.textContent = `${payload.agent_name} está escribiendo...`;
      streamingDivs[payload.agent_id] = addMessage("agent", payload.agent_name, "");
      streamingDivs[payload.agent_id].style.borderLeftColor = agentColors[payload.agent_id] || "#6c5ce7";
      break;
    case "agent_chunk":
      if (streamingDivs[payload.agent_id]) {
        streamingDivs[payload.agent_id].querySelector(".content").textContent += payload.chunk;
        document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
      }
      break;
    case "agent_message_complete":
      typingLabel.textContent = "";
      delete streamingDivs[payload.agent_id];
      break;
    case "agent_error":
      addMessage("system", "Sistema", `Error con ${payload.agent_id}: ${payload.error}`);
      break;
    case "director_decision":
      if (payload.reasoning) addMessage("director", "Director", payload.reasoning);
      break;
    case "summary":
      addMessage("director", "Resumen del Director", payload.content);
      break;
    case "user_message":
      break; // ya lo pintamos localmente al enviarlo
    case "debate_ended":
      typingLabel.textContent = "";
      addMessage("system", "Sistema", `Debate finalizado (${payload.status}).`);
      document.getElementById("statusLabel").textContent = "finalizado";
      break;
    case "error":
      addMessage("system", "Sistema", payload.message || "Error desconocido");
      break;
  }
}

function sendUserMessage() {
  const input = document.getElementById("userInput");
  const content = input.value.trim();
  if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
  addMessage("user", "Tú", content);
  ws.send(JSON.stringify({ type: "user_message", content }));
  input.value = "";
}

document.getElementById("userInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendUserMessage();
});

// Participantes de ejemplo para empezar rápido
addAgentCard("Analista Económico", "Economista", "mock");
addAgentCard("Ingeniero de Producto", "Ingeniero", "mock");
addAgentCard("Investigador Crítico", "Investigador", "mock");
</script>
</body>
</html>
